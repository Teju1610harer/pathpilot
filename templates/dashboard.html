<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - PathPilot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Welcome, {{ name }}</h1>
    <p>This is your student dashboard.</p>
    <p><a href="/assessment">Take Career Assessment</a></p>
    <p><a href="/results">View My Results</a></p>
    <p><a href="/history">View History</a></p>
    {% if role == "admin" %}
    <p><a href="/admin">Admin Panel</a></p>
    {% endif %}
    <p><a href="/feedback">Give Feedback</a></p>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
